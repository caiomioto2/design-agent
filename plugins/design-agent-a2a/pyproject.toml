[project]
name = "design-agent-a2a"
version = "0.1.0"
description = "Local Codex bridge to an existing Design Agent runtime over A2A 1.0"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "fastmcp==4.1.3",
  "websockets>=15,<17",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "S101", "S104", "S105", "S106", "S108", "S603", "S607", "ARG001", "ARG002", "ARG005"]
